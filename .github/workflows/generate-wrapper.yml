
name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate Official Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Commit Wrapper Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper/

          if git diff --cached --quiet; then
            echo "No wrapper changes detected."
          else
            git commit -m "Generate official Gradle 8.9 wrapper"
            git push origin HEAD:main
          fi
