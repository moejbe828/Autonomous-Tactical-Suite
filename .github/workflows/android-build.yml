
name: ATS Android Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build and Test ATS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Validate Android Manifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("AndroidManifest.xml is valid XML")
          PY

      - name: Build, Test and Lint
        run: |
          ./gradlew --no-daemon --stacktrace --info clean \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug

      - name: Upload APK and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Debug-APK-and-Reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
